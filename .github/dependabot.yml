version: 2

updates:
  # Dependabot also updates .github/workflows/actions.lock in the same pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so a compromised version has time to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # The source generator is built against the oldest compiler it supports. A newer Roslyn would stop it loading in
      # earlier .NET 10 SDKs and Visual Studio versions (CS9057), so this is raised by hand when the generator needs it.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
