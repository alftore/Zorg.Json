name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json picks SDK 11. The 10 SDK brings the .NET 10 runtime, which the net10.0 builds test on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Get the Go validator
        shell: bash
        run: |
          base=https://github.com/santhosh-tekuri/jsonschema/releases/download/v6.0.3
          mkdir -p "$RUNNER_TEMP/jv" && cd "$RUNNER_TEMP/jv"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL -o jv.zip "$base/jv-v6.0.3-windows-amd64.zip"
            echo "a1ab4c5b1e735de28d34401402624194474aa006db0926f0c99ec043e4795c2c  jv.zip" | sha256sum -c -
            unzip -q jv.zip
            echo "ZORG_JV=$RUNNER_TEMP\\jv\\jv.exe" >> "$GITHUB_ENV"
          else
            curl -fsSL -o jv.tar.gz "$base/jv-v6.0.3-linux-amd64.tar.gz"
            echo "36e9ab8481cc8e2cb27c8336decc9abdcbd606b05792ca88d6188e01ec28766b  jv.tar.gz" | sha256sum -c -
            tar -xzf jv.tar.gz
            echo "ZORG_JV=$RUNNER_TEMP/jv/jv" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: dotnet build Zorg.Json.slnx -c Release

      - name: Test
        run: dotnet test --solution Zorg.Json.slnx -c Release --no-build --coverage --coverage-output-format cobertura

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:PackageOutputPath="$RUNNER_TEMP/packages"
          done

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: '**/TestResults/**/*.cobertura.xml'
          if-no-files-found: error

  aot-smoke:
    name: AOT smoke publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json picks SDK 11. The 10 SDK brings the .NET 10 runtime, which the net10.0 builds test on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # The explicit shell turns on pipefail, so a failed publish isn't hidden by tee.
      # The grep is a second gate that keeps working if the warnings stop being errors.
      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/Zorg.Json.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot" | tee "$RUNNER_TEMP/publish.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run
        shell: bash
        run: '"$RUNNER_TEMP/aot/Zorg.Json.AotSmoke"'

      - name: Publish ASP.NET Core
        shell: bash
        run: |
          dotnet publish samples/Zorg.Json.AspNetCore.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot-web" | tee "$RUNNER_TEMP/publish-web.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish-web.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run ASP.NET Core
        shell: bash
        run: '"$RUNNER_TEMP/aot-web/Zorg.Json.AspNetCore.AotSmoke"'
