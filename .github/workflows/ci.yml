name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Zorg.Json.slnx -c Release

      - name: Test
        run: dotnet test --solution Zorg.Json.slnx -c Release --no-build --coverage --coverage-output-format cobertura

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:PackageOutputPath="$RUNNER_TEMP/packages"
          done

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: '**/TestResults/**/*.cobertura.xml'
          if-no-files-found: error

  aot-smoke:
    name: AOT smoke publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # The explicit shell turns on pipefail, so a failed publish isn't hidden by tee.
      # The grep is a second gate that keeps working if the warnings stop being errors.
      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/Zorg.Json.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot" | tee "$RUNNER_TEMP/publish.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run
        shell: bash
        run: '"$RUNNER_TEMP/aot/Zorg.Json.AotSmoke"'

      - name: Publish ASP.NET Core
        shell: bash
        run: |
          dotnet publish samples/Zorg.Json.AspNetCore.AotSmoke -r linux-x64 -c Release -o "$RUNNER_TEMP/aot-web" | tee "$RUNNER_TEMP/publish-web.log"
          if grep -E '\bIL[23][0-9]{3}\b' "$RUNNER_TEMP/publish-web.log"; then
            echo "::error::The publish reported trim or AOT warnings."
            exit 1
          fi

      - name: Run ASP.NET Core
        shell: bash
        run: '"$RUNNER_TEMP/aot-web/Zorg.Json.AspNetCore.AotSmoke"'
